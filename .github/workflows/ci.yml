name: CI

# The repo had no CI at all, and next.config.js sets both
# `typescript.ignoreBuildErrors` and `eslint.ignoreDuringBuilds` — so nothing,
# anywhere, ever type-checked or linted this project. A real type error sat in
# the tree undetected as a result.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    # The app queries MySQL during server rendering, so without a database the
    # smoke test only proves pages fail gracefully — not that they work.
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: gameengine
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: '3306'
      MYSQL_USER: root
      MYSQL_PASSWORD: ''
      MYSQL_DATABASE: gameengine

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 20: the local build segfaults on Node 22 + @next/swc-darwin-arm64.
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: |
          for m in $(ls migrations/*.sql | sort); do
            echo "-> $(basename "$m")"
            # 001 creates a trigger; on some MySQL builds that needs SUPER, and
            # the app no longer depends on it, so a failure there is tolerated.
            mysql -h 127.0.0.1 -P 3306 -u root gameengine < "$m" || echo "   (skipped: $m)"
          done

      - name: Type-check
        run: npm run type-check

      # Now blocking: the tree is at zero lint errors, including the
      # react-hooks/rules-of-hooks violations that had to be refactored out of
      # SceneView. Keep it that way.
      - name: Lint
        run: npm run lint

      - name: Tests
        # Covers the runtime, serializer, name fields, access control, COPPA,
        # moderation keyword scan, prefabs and the asset generators.
        run: npm run test:all

      - name: Build
        run: npm run build
        env:
          # The build only needs these to exist; it never connects.
          JWT_SECRET: ci-placeholder-not-a-real-secret

      # Status codes are not proof a page works — a deploy once white-screened
      # the whole site with a client-side exception while every page returned
      # HTTP 200. This loads each page in real Chromium and fails on any
      # uncaught exception, console error, or missing JS chunk.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser smoke test
        run: |
          JWT_SECRET=ci-placeholder-not-a-real-secret npx next start -p 3000 &
          for i in $(seq 1 40); do
            curl -sf -o /dev/null http://localhost:3000 && break
            sleep 2
          done
          node scripts/smoke.js http://localhost:3000
